name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # 打 tag 时用 GITHUB_TOKEN 创建 Release 并附加 DMG

jobs:
  build:
    name: 编译 App 与安装盘
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcode-select -p
          xcrun swiftc --version

      - name: 编译菜单栏 App
        run: ./build.sh

      # CI 里不跑 make-dmg.sh：它会 diskutil 挂载镜像再写 .DS_Store 排版，
      # 在无图形会话的 runner 上不稳定。这里用 hdiutil 直接成型，内容一样（少个背景图）。
      - name: 打包 DMG
        run: |
          set -e
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' ui/Info.plist)
          STAGE=build/ci-stage
          rm -rf "$STAGE" && mkdir -p "$STAGE" dist
          cp -R build/YunshuSwitch.app "$STAGE/云枢开关.app"
          ln -s /Applications "$STAGE/应用程序"
          cp assets/使用说明.txt "$STAGE/使用说明.txt"
          hdiutil create -volname "云枢开关" -srcfolder "$STAGE" -fs HFS+ \
            -format UDZO -ov "dist/YunShuSwitch.dmg"
          ls -lh dist/YunShuSwitch.dmg
          echo "版本 $VERSION"

      - name: 校验产物
        run: |
          MOUNT=$(hdiutil attach dist/YunShuSwitch.dmg -readonly -nobrowse | awk -F'\t' 'END{print $NF}')
          ls -la "$MOUNT"
          test -x "$MOUNT/云枢开关.app/Contents/MacOS/YunshuSwitch"
          hdiutil detach "$MOUNT"

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: YunShuSwitch-dmg
          path: dist/YunShuSwitch.dmg
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YunShuSwitch.dmg
          generate_release_notes: true
